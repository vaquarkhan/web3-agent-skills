name: validate-and-package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: npm run validate
      - run: npm test
      - run: npm run eval
      - run: node --check vscode-extension/extension.js

  package-vscode:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm install -g @vscode/vsce
      - run: cd vscode-extension && vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: vscode-extension/*.vsix
